<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<title>ScoutBook · App + Web 介面</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="stylesheet" href="styles.css"/>
<style>
  html, body { margin: 0; padding: 0; }
  body { font-family: 'Noto Sans TC', system-ui, sans-serif; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="browser-window.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>

<script type="text/babel" src="sb-atoms.jsx"></script>
<script type="text/babel" src="sb-app-1.jsx"></script>
<script type="text/babel" src="sb-app-2.jsx"></script>
<script type="text/babel" src="sb-record.jsx"></script>
<script type="text/babel" src="sb-app-3.jsx"></script>
<script type="text/babel" src="sb-app-4.jsx"></script>
<script type="text/babel" src="sb-web-1.jsx"></script>
<script type="text/babel" src="sb-web-2.jsx"></script>
<script type="text/babel" src="sb-web-3.jsx"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const PHONE_W = 393;
const PHONE_H = 852;
const WEB_W = 1280;
const WEB_H = 800;

// Wraps a screen in an iPhone bezel
function Phone({ children, dark = false }) {
  return (
    <div style={{ filter: 'drop-shadow(0 30px 60px rgba(27,34,48,0.18))' }}>
      <IOSDevice width={PHONE_W} height={PHONE_H} dark={dark}>
        <div style={{ position: 'relative', width: PHONE_W, height: PHONE_H }}>
          {children}
        </div>
      </IOSDevice>
    </div>
  );
}

// Wraps a web screen in a browser window
function Web({ children, url = 'scoutbook.app' }) {
  return (
    <ChromeWindow width={WEB_W} height={WEB_H} url={url}
      tabs={[{ title: 'ScoutBook · ' + url.replace('scoutbook.app', '') }]}>
      <div style={{ width: WEB_W, height: WEB_H - 84, position: 'relative' }}>
        {children}
      </div>
    </ChromeWindow>
  );
}

function App() {
  return (
    <DesignCanvas>
      {/* SECTION: COVER */}
      <DCSection id="cover" title="SCOUTBOOK" subtitle="球場紋理 · 土壤色 + 草綠 + 粉筆線 · App 主要記錄 + Web 瀏覽分析市集">
        <DCArtboard id="brand" label="設計系統 · Visual DNA" width={920} height={520}>
          <div className="sb-root" style={{ width: '100%', height: '100%', background: 'var(--paper)', padding: 36, position: 'relative', overflow: 'hidden' }}>
            <div style={{ position: 'absolute', top: -40, right: -40, opacity: 0.06 }}>
              <svg width="320" height="320" viewBox="0 0 320 320">
                <circle cx="160" cy="160" r="140" fill="none" stroke="var(--ink)" strokeWidth="12"/>
                <path d="M40 100 Q160 200 280 100 M40 220 Q160 120 280 220" stroke="var(--ball)" strokeWidth="8" fill="none"/>
              </svg>
            </div>
            <div className="sb-display" style={{ fontSize: 11, color: 'var(--clay-deep)', letterSpacing: '0.24em' }}>2026 · PRODUCT DESIGN SPEC</div>
            <div className="sb-display" style={{ fontSize: 68, fontWeight: 700, color: 'var(--ink)', letterSpacing: '0.06em', lineHeight: 1.05, marginTop: 8 }}>
              SCOUTBOOK
            </div>
            <div style={{ fontSize: 22, color: 'var(--ink-2)', marginTop: 4 }}>球探筆記 · 場邊紀錄 + 球員資料庫 + AI 報告 + 內容市集</div>

            <div className="sb-stitch" style={{ marginTop: 28, marginBottom: 20 }}></div>

            {/* tokens grid */}
            <div style={{ display: 'grid', gridTemplateColumns: '2fr 3fr 2fr', gap: 28 }}>
              {/* fonts */}
              <div>
                <div className="sb-display" style={{ fontSize: 10, color: 'rgba(27,34,48,0.5)', letterSpacing: '0.16em' }}>FONTS</div>
                <div className="sb-display" style={{ fontSize: 34, fontWeight: 700, marginTop: 6 }}>Oswald · 數字</div>
                <div className="sb-num" style={{ fontSize: 44, color: 'var(--clay-deep)' }}>.356 · 1.072</div>
                <div style={{ fontSize: 14, marginTop: 10 }}>Noto Sans TC · 中文內文</div>
                <div className="sb-mono" style={{ fontSize: 11, marginTop: 4, color: 'rgba(27,34,48,0.6)' }}>JetBrains Mono · code</div>
              </div>

              {/* palette */}
              <div>
                <div className="sb-display" style={{ fontSize: 10, color: 'rgba(27,34,48,0.5)', letterSpacing: '0.16em' }}>COLOR · 球場紋理</div>
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(6, 1fr)', gap: 8, marginTop: 8 }}>
                  {[
                    { name: 'paper', c: 'var(--paper)' },
                    { name: 'chalk', c: 'var(--chalk)' },
                    { name: 'clay', c: 'var(--clay)' },
                    { name: 'clay-deep', c: 'var(--clay-deep)' },
                    { name: 'grass', c: 'var(--grass)' },
                    { name: 'ink', c: 'var(--ink)' },
                  ].map((s) => (
                    <div key={s.name}>
                      <div style={{ aspectRatio: '1', borderRadius: 8, background: s.c, border: '1px solid rgba(27,34,48,0.06)' }}/>
                      <div className="sb-display" style={{ fontSize: 9, marginTop: 4, color: 'var(--ink-3)' }}>{s.name}</div>
                    </div>
                  ))}
                </div>
                <div className="sb-display" style={{ fontSize: 10, color: 'rgba(27,34,48,0.5)', letterSpacing: '0.16em', marginTop: 14 }}>SIGNALS · STRIKE · BALL · WARN</div>
                <div style={{ display: 'flex', gap: 6, marginTop: 6 }}>
                  <Chip tone="strike" solid>STRIKE 好球</Chip>
                  <Chip tone="ball" solid>BALL 壞球</Chip>
                  <Chip tone="warn" solid>WARN 界外</Chip>
                </div>
                <div className="sb-display" style={{ fontSize: 10, color: 'rgba(27,34,48,0.5)', letterSpacing: '0.16em', marginTop: 14 }}>PITCH 球種色票</div>
                <div style={{ display: 'flex', gap: 6, marginTop: 6, flexWrap: 'wrap' }}>
                  {['FB', 'SI', 'SL', 'CB', 'CH', 'SF', 'XX'].map((p) => (
                    <div key={p} style={{ display: 'flex', alignItems: 'center', gap: 4, padding: '3px 8px', borderRadius: 999, background: 'var(--chalk)', border: '1px solid rgba(27,34,48,0.08)', fontSize: 11 }}>
                      <PitchSwatch code={p}/>
                      <b className="sb-display">{p}</b> {PITCH_NAMES[p]}
                    </div>
                  ))}
                </div>
              </div>

              {/* signature */}
              <div>
                <div className="sb-display" style={{ fontSize: 10, color: 'rgba(27,34,48,0.5)', letterSpacing: '0.16em' }}>SIGNATURE</div>
                <div style={{ marginTop: 8, display: 'flex', flexDirection: 'column', gap: 8 }}>
                  <div className="sb-stitch"></div>
                  <div style={{ fontSize: 12 }}>球縫線 stitch 分隔</div>
                  <div style={{ aspectRatio: '1.6', borderRadius: 10, background: 'linear-gradient(135deg, var(--grass) 30%, var(--clay) 100%)', position: 'relative', overflow: 'hidden' }}>
                    <FieldMap width={200} height={120} hits={[
                      { x: 80, y: 60, type: 'hr' }, { x: 130, y: 80, type: 'single' }, { x: 60, y: 80, type: 'double' },
                    ]}/>
                  </div>
                  <div style={{ fontSize: 12 }}>球場俯視 + 落點 散點圖</div>
                </div>
              </div>
            </div>

            <div style={{ position: 'absolute', bottom: 28, right: 36, textAlign: 'right' }}>
              <div className="sb-display" style={{ fontSize: 10, color: 'var(--clay-deep)', letterSpacing: '0.2em' }}>2 PLATFORMS · 12 APP + 10 WEB SCREENS</div>
              <div style={{ fontSize: 13, color: 'rgba(27,34,48,0.65)', marginTop: 2 }}>iOS / Android App (主要輸入) · Web (瀏覽 / 分析 / 市集)</div>
            </div>
          </div>
        </DCArtboard>
      </DCSection>

      {/* ───────── APP ───────── */}
      <DCSection id="app-core" title="App · 核心流程" subtitle="登入 → Dashboard → 設定 Wizard → 比賽中記錄 → 比賽結算">
        <DCArtboard id="app-login" label="0 · 登入 Google SSO" width={PHONE_W} height={PHONE_H}>
          <Phone dark><Screen_Login/></Phone>
        </DCArtboard>
        <DCArtboard id="app-dashboard" label="1 · 主控台 Dashboard" width={PHONE_W} height={PHONE_H}>
          <Phone><Screen_Dashboard/></Phone>
        </DCArtboard>
        <DCArtboard id="app-wizard" label="2 · 設定 Wizard · 打序" width={PHONE_W} height={PHONE_H}>
          <Phone><Screen_Wizard/></Phone>
        </DCArtboard>
        <DCArtboard id="app-rec-a" label="3A · 保守 (Conservative)" width={PHONE_W} height={PHONE_H}>
          <Phone dark><Screen_RecordA/></Phone>
        </DCArtboard>
        <DCArtboard id="app-rec-wheel" label="3A · 長按格子 → 球種" width={PHONE_W} height={PHONE_H}>
          <Phone dark><Screen_RecordA_Wheel/></Phone>
        </DCArtboard>
        <DCArtboard id="app-rec-batted" label="3A · 點擊出 → 擊球類型" width={PHONE_W} height={PHONE_H}>
          <Phone dark><Screen_RecordA_Batted/></Phone>
        </DCArtboard>
        <DCArtboard id="app-rec-result" label="3A · 長按落點選結果" width={PHONE_W} height={PHONE_H}>
          <Phone dark><Screen_RecordA_Result/></Phone>
        </DCArtboard>
        <DCArtboard id="app-rec-menu" label="3A · ⋯ 本場操作選單" width={PHONE_W} height={PHONE_H}>
          <Phone dark><Screen_RecordA_Menu/></Phone>
        </DCArtboard>
        <DCArtboard id="app-result" label="4 · 比賽結算 · 打者" width={PHONE_W} height={PHONE_H}>
          <Phone dark><Screen_Result/></Phone>
        </DCArtboard>
        <DCArtboard id="app-result-p" label="4b · 比賽結算 · 投手" width={PHONE_W} height={PHONE_H}>
          <Phone dark><Screen_ResultPitcher/></Phone>
        </DCArtboard>
      </DCSection>

      <DCSection id="app-reports" title="App · 球員 + 球探報告" subtitle="球員資料庫 → 打者版 6 區塊 / 投手版 6 區塊">
        <DCArtboard id="app-players" label="6 · 球員資料庫" width={PHONE_W} height={PHONE_H}>
          <Phone><Screen_Players/></Phone>
        </DCArtboard>
        <DCArtboard id="app-batter" label="7 · 打者版球探報告 · 6 區塊" width={PHONE_W} height={PHONE_H}>
          <Phone dark><Screen_BatterReport/></Phone>
        </DCArtboard>
        <DCArtboard id="app-pitcher" label="7P · 投手版球探報告 · 6 區塊" width={PHONE_W} height={PHONE_H}>
          <Phone dark><Screen_PitcherReport/></Phone>
        </DCArtboard>
      </DCSection>

      <DCSection id="app-market" title="App · 內容市集" subtitle="市集首頁 → 報告詳情 (模糊遮罩) → 賣家收益儀表板">
        <DCArtboard id="app-market" label="8.1 · 市集首頁" width={PHONE_W} height={PHONE_H}>
          <Phone><Screen_Market/></Phone>
        </DCArtboard>
        <DCArtboard id="app-listing" label="8.2 · 報告詳情 · 模糊遮罩" width={PHONE_W} height={PHONE_H}>
          <Phone dark><Screen_ListingDetail/></Phone>
        </DCArtboard>
        <DCArtboard id="app-earnings" label="8.5 · 賣家收益儀表板" width={PHONE_W} height={PHONE_H}>
          <Phone><Screen_Earnings/></Phone>
        </DCArtboard>
      </DCSection>

      {/* ───────── WEB ───────── */}
      <DCSection id="web-core" title="Web · 主控台 + 瀏覽" subtitle="桌面端 · 三欄佈局 · 1280×800 設計尺寸">
        <DCArtboard id="web-dash" label="W1 · 主控台" width={WEB_W} height={WEB_H}>
          <Web url="scoutbook.app/dashboard"><Web_Dashboard/></Web>
        </DCArtboard>
        <DCArtboard id="web-players" label="W4 · 球員資料庫 + Drawer" width={WEB_W} height={WEB_H}>
          <Web url="scoutbook.app/players"><Web_Players/></Web>
        </DCArtboard>
      </DCSection>

      <DCSection id="web-reports" title="Web · 球探報告 + 對比" subtitle="左 TOC · 中央內容 · 右 PA log · 雙球員對比">
        <DCArtboard id="web-scout" label="W5 · 球探報告" width={WEB_W} height={WEB_H}>
          <Web url="scoutbook.app/players/wang-li-xiang"><Web_ScoutReport/></Web>
        </DCArtboard>
        <DCArtboard id="web-compare" label="W6 · 球員對比" width={WEB_W} height={WEB_H}>
          <Web url="scoutbook.app/players/compare?a=23&b=4"><Web_Compare/></Web>
        </DCArtboard>
      </DCSection>

      <DCSection id="web-market" title="Web · 市集 + 收益 + 訂閱" subtitle="瀏覽購買 · 賣家儀表板 · SaaS 方案">
        <DCArtboard id="web-mk" label="W7 · 市集首頁" width={WEB_W} height={WEB_H}>
          <Web url="scoutbook.app/market"><Web_Market/></Web>
        </DCArtboard>
        <DCArtboard id="web-listing" label="W8 · 報告詳情 · sticky 購買卡" width={WEB_W} height={WEB_H}>
          <Web url="scoutbook.app/market/lin-jian-hong-sp"><Web_ListingDetail/></Web>
        </DCArtboard>
        <DCArtboard id="web-earnings" label="W10 · 賣家收益" width={WEB_W} height={WEB_H}>
          <Web url="scoutbook.app/earnings"><Web_Earnings/></Web>
        </DCArtboard>
        <DCArtboard id="web-sub" label="W12 · 訂閱方案" width={WEB_W} height={WEB_H}>
          <Web url="scoutbook.app/settings/subscription"><Web_Subscription/></Web>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
