<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<title>ScoutBook · Interactive Prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"/>
<meta name="theme-color" content="#0F141C"/>
<meta name="color-scheme" content="light"/>
<link rel="stylesheet" href="styles.css"/>

<style>
  html, body { margin: 0; padding: 0; height: 100%; overscroll-behavior: none; }
  body {
    font-family: 'Noto Sans TC', system-ui, sans-serif;
    background: #0a1118;
    color: #fff;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  #root { position: fixed; inset: 0; }

  /* Phone-shaped frame: fills viewport but constrained on desktop */
  .pt-frame {
    position: relative;
    width: 100%;
    height: 100dvh; height: 100vh; /* fallback */
    overflow: hidden;
    background: #0a1118;
  }
  @media (min-width: 520px) {
    .pt-stage {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100dvh; height: 100vh;
      background:
        radial-gradient(ellipse at 50% 70%, rgba(77,123,58,0.15) 0%, transparent 60%),
        radial-gradient(ellipse at 50% 0%, rgba(185,119,68,0.08) 0%, transparent 50%),
        #0a1118;
    }
    .pt-frame {
      width: 420px;
      height: min(900px, calc(100dvh - 24px));
      border-radius: 36px;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.06),
        0 40px 100px rgba(0,0,0,0.6),
        0 0 80px rgba(77,123,58,0.04);
      border: 8px solid #1a1f2a;
    }
    .pt-label {
      position: fixed;
      top: 18px;
      left: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 999px;
      color: rgba(255,255,255,0.7);
      font-family: 'Oswald', sans-serif;
      font-size: 11px;
      letter-spacing: 0.16em;
      z-index: 1000;
    }
    .pt-label::before {
      content: '';
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--ball);
      box-shadow: 0 0 8px var(--ball);
      animation: pt-pulse 1.6s ease-in-out infinite;
    }
    .pt-help {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 14px;
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 999px;
      color: rgba(255,255,255,0.55);
      font-size: 11px;
      z-index: 1000;
      max-width: calc(100vw - 40px);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  }
  @media (max-width: 519px) {
    .pt-label, .pt-help { display: none; }
  }

  /* Screen transitions */
  .pt-screen {
    position: absolute;
    inset: 0;
    animation: pt-screen-in 280ms ease-out;
  }
  .pt-screen.back {
    animation: pt-screen-back 280ms ease-out;
  }

  /* Animations */
  @keyframes pt-screen-in {
    from { opacity: 0; transform: translateX(6%); }
    to   { opacity: 1; transform: translateX(0); }
  }
  @keyframes pt-screen-back {
    from { opacity: 0; transform: translateX(-6%); }
    to   { opacity: 1; transform: translateX(0); }
  }
  @keyframes pt-pulse {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.3; }
  }
  @keyframes sb-pop {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.4); }
    60%  { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
    100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }
  @keyframes sb-fadein {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @keyframes sb-slideup {
    from { transform: translateY(20px); opacity: 0; }
    to   { transform: translateY(0); opacity: 1; }
  }
  @keyframes sb-pulse {
    0%, 100% { box-shadow: 0 8px 32px rgba(194,76,47,0.5), 0 0 0 0 rgba(194,76,47,0.4); }
    50%      { box-shadow: 0 8px 32px rgba(194,76,47,0.5), 0 0 0 12px rgba(194,76,47,0); }
  }
  @keyframes sb-toast {
    0%   { opacity: 0; transform: scale(0.7); }
    15%  { opacity: 1; transform: scale(1.05); }
    25%  { transform: scale(1); }
    80%  { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(0.95); }
  }

  button { font-family: inherit; }
  /* prevent iOS double-tap zoom */
  * { touch-action: manipulation; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="sb-atoms.jsx"></script>
<script type="text/babel" src="proto-state.jsx"></script>
<script type="text/babel" src="proto-screens.jsx"></script>
<script type="text/babel" src="proto-record.jsx"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
function ScreenSwitcher() {
  const [state] = useGame();
  const { screen, transition } = state;

  const screenComponent = {
    login:     <ProtoLogin/>,
    dashboard: <ProtoDashboard/>,
    wizard:    <ProtoWizard/>,
    record:    <ProtoRecord/>,
    result:    <ProtoResult/>,
  }[screen] || <ProtoLogin/>;

  // key by screen so React unmounts old, animates new in
  return (
    <div className={`pt-screen ${transition === 'back' ? 'back' : ''}`} key={screen} data-screen-label={screen}>
      {screenComponent}
    </div>
  );
}

function App() {
  const [state] = React.useState(null);
  return (
    <GameProvider>
      <div className="pt-stage">
        <div className="pt-label">SCOUTBOOK · PROTOTYPE</div>
        <div className="pt-frame">
          <ScreenSwitcher/>
        </div>
        <div className="pt-help">
          原型示範 · 點擊好球帶格子記錄落點 · 長按開啟球種選擇圓盤
        </div>
      </div>
    </GameProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
